<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Brain Dead Halftone Dot Pattern -->
    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3.5" fill="#18181b" fill-opacity="0.25"/>
    </pattern>

    <!-- Grain / Noise Lines -->
    <pattern id="zine-grain" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.15"/>
    </pattern>

    <!-- Clip Path for the Brain Dead Silhouette -->
    <clipPath id="head-clip">
      <path d="M 150 480 C 120 440 100 380 100 320 C 100 200 180 130 300 130 C 410 130 480 200 480 310 C 480 370 450 410 420 450 C 410 465 415 490 415 520 L 310 520 L 300 460 C 270 460 250 480 220 480 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas Base: Earthy Vintage Cream / Bone Background -->
  <rect width="1200" height="630" fill="#f4f1ea"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Raw Heavy Border Frame (DIY Zine Style) -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#18181b" stroke-width="8"/>
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#18181b" stroke-width="2"/>

  <!-- LEFT GRAPHIC: BRAIN DEAD HEAD PROFILE & ABSTRACT CIRCUITRY -->
  <g transform="translate(40, 10)">
    <!-- Shadow Offset Behind Head -->
    <path d="M 160 490 C 130 450 110 390 110 330 C 110 210 190 140 310 140 C 420 140 490 210 490 320 C 490 380 460 420 430 460 C 420 475 425 500 425 530 L 320 530 L 310 470 C 280 470 260 490 230 490 Z" fill="#cc3300"/>
    
    <!-- Main Head Silhouette Fill (Toxic Lime Green) -->
    <path d="M 150 480 C 120 440 100 380 100 320 C 100 200 180 130 300 130 C 410 130 480 200 480 310 C 480 370 450 410 420 450 C 410 465 415 490 415 520 L 310 520 L 300 460 C 270 460 250 480 220 480 Z" fill="#99cc00" stroke="#18181b" stroke-width="7"/>

    <!-- Inside Head: Brain/Circuit Graphic Elements (Clipped) -->
    <g clip-path="url(#head-clip)">
      <circle cx="290" cy="280" r="110" fill="#ff9900" stroke="#18181b" stroke-width="5"/>
      <circle cx="290" cy="280" r="60" fill="#0066cc" stroke="#18181b" stroke-width="5"/>
      
      <!-- Graphic Grid Overlay in Brain Area -->
      <line x1="200" y1="200" x2="380" y2="360" stroke="#18181b" stroke-width="4"/>
      <line x1="380" y1="200" x2="200" y2="360" stroke="#18181b" stroke-width="4"/>
      <rect x="260" y="250" width="60" height="60" fill="#ffff00" stroke="#18181b" stroke-width="4"/>
      <text x="290" y="290" font-family="Impact, sans-serif" font-size="28" fill="#18181b" text-anchor="middle">CPA</text>
    </g>

    <!-- Surreal Floating Eye Graphic (Brain Dead Signature) -->
    <circle cx="410" cy="220" r="30" fill="#ffffff" stroke="#18181b" stroke-width="6"/>
    <circle cx="410" cy="220" r="12" fill="#18181b"/>
    <circle cx="414" cy="216" r="4" fill="#ffffff"/>
  </g>

  <!-- RIGHT CONTENT: TEXT & COLORED ZINE BOXES -->
  <g transform="translate(520, 70)">
    
    <!-- Top Offset Header Box -->
    <g transform="translate(0, 0)">
      <rect x="6" y="6" width="340" height="40" fill="#18181b"/>
      <rect x="0" y="0" width="340" height="40" fill="#ff3366" stroke="#18181b" stroke-width="4"/>
      <text x="170" y="27" font-family="Impact, Arial Black, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">SAN DIEGO, CA // EST. 1978</text>
    </g>

    <!-- MAIN BRAND TITLE (Offset Brutalist Stencil Look) -->
    <g transform="translate(0, 70)">
      <!-- Drop Shadow Text -->
      <text x="4" y="54" font-family="Impact, Arial Black, sans-serif" font-size="64" fill="#18181b" letter-spacing="1">NYBERG FINANCIAL</text>
      <!-- Main Text -->
      <text x="0" y="50" font-family="Impact, Arial Black, sans-serif" font-size="64" fill="#0066cc" letter-spacing="1">NYBERG FINANCIAL</text>
    </g>

    <!-- Subtitle Banner -->
    <g transform="translate(0, 140)">
      <rect x="4" y="4" width="580" height="45" fill="#18181b"/>
      <rect x="0" y="0" width="580" height="45" fill="#ffff00" stroke="#18181b" stroke-width="4"/>
      <text x="15" y="30" font-family="Impact, Arial Black, sans-serif" font-size="22" fill="#18181b" letter-spacing="1">SIMPLIFIED TAX PREPARATION &amp; STRATEGY</text>
    </g>

    <!-- Technical Bullet Points in Underground Comic Box -->
    <g transform="translate(0, 210)">
      <rect x="5" y="5" width="580" height="150" fill="#18181b"/>
      <rect x="0" y="0" width="580" height="150" fill="#ffffff" stroke="#18181b" stroke-width="4"/>
      
      <text x="20" y="38" font-family="'Courier New', Courier, monospace" font-size="16" fill="#18181b" font-weight="900">► INDIVIDUAL 1040 // REAL ESTATE INVESTORS</text>
      <text x="20" y="72" font-family="'Courier New', Courier, monospace" font-size="16" fill="#18181b" font-weight="900">► S-CORP 1120-S // PARTNERSHIPS &amp; LLCs</text>
      <text x="20" y="106" font-family="'Courier New', Courier, monospace" font-size="16" fill="#18181b" font-weight="900">► STRATEGIC PLANNING &amp; ESTIMATED TAXES</text>
      <text x="20" y="132" font-family="'Courier New', Courier, monospace" font-size="13" fill="#cc3300" font-weight="bold">★ CAMERON ATTISHA, CPA // TAXDOME SECURE PORTAL</text>
    </g>

    <!-- CTA Button (Brain Dead Patch Style) -->
    <g transform="translate(0, 385)">
      <rect x="6" y="6" width="320" height="55" fill="#18181b"/>
      <rect x="0" y="0" width="320" height="55" fill="#99cc00" stroke="#18181b" stroke-width="5"/>
      <text x="160" y="36" font-family="Impact, Arial Black, sans-serif" font-size="22" fill="#18181b" text-anchor="middle" letter-spacing="1">ACCESS CLIENT PORTAL ➔</text>
    </g>

  </g>

  <!-- Zine Noise Overlay -->
  <rect width="1200" height="630" fill="url(#zine-grain)" pointer-events="none"/>
</svg>
